name: iOS Xcode Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS Xcode App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sweetbake-app/package-lock.json

      - name: Install JavaScript Dependencies
        working-directory: sweetbake-app
        run: npm ci

      - name: Verify TypeScript Compilation
        working-directory: sweetbake-app
        run: npx tsc --noEmit

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: sweetbake-app/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('sweetbake-app/ios/Podfile.lock', 'sweetbake-app/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: sweetbake-app/ios
        run: |
          pod install

      - name: Build with Xcode (xcodebuild)
        working-directory: sweetbake-app/ios
        run: |
          xcodebuild \
            -workspace sweetbakeapp.xcworkspace \
            -scheme sweetbakeapp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Compress App Bundle
        working-directory: sweetbake-app/ios
        run: |
          cd build/Build/Products/Release-iphonesimulator
          tar -czvf ../../../../sweetbakeapp.app.tar.gz sweetbakeapp.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweetbakeapp-simulator-build
          path: sweetbakeapp.app.tar.gz
          retention-days: 14

